<section class="hero" id="home" aria-labelledby="hero-title">
  <div class="hero-content">
    <img class="hero-logo" src="/assets/logo.png" alt="MM" />
    <div class="hero-wordmark" aria-labelledby="hero-title">
      <h1 id="hero-title" class="hero-title">
        <span class="hero-initials">MM</span>
        <span class="hero-profession"><span translate="no">FLUTTER</span><span translate="no">DEVELOPER</span></span>
      </h1>
      <p translate="no" class="hero-role">Senior Mobile Frontend</p>
    </div>
    <p class="hero-intro">
      I build thoughtful mobile experiences with clean code, strong interfaces and a sharp eye for detail.
    </p>
    <div class="hero-actions">
      <a class="hero-cta" href="#contact">Let's work together <span aria-hidden="true">&#8594;</span></a>
      <div class="cv-download">
        <button
          class="hero-cta hero-cta-secondary"
          type="button"
          aria-label="Download CV"
          aria-controls="cv-download-options"
          [attr.aria-expanded]="isCvMenuOpen()"
          (click)="toggleCvMenu()"
        >
          Download CV <span aria-hidden="true">&#8595;</span>
        </button>
        @if (isCvMenuOpen()) {
          <div class="cv-download-options" id="cv-download-options" aria-label="Choose CV language">
            <a href="/assets/cv/MatteoMariani_CV_it.pdf" download (click)="closeCvMenu()">Italiano</a>
            <a href="/assets/cv/MatteoMariani_CV_en.pdf" download (click)="closeCvMenu()">English</a>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="hero-visual" aria-label="Profile photo">
    <div class="profile-photo-frame">
      <img class="profile-photo" src="/assets/profile.png" alt="Matteo Mariani" />
    </div>
  </div>
</section>
