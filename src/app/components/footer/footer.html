    <p translate="no">© 2026 Matteo Mariani <span aria-hidden="true">·</span> Mobile &amp; FE Engineer</p>

<a
    class="back-to-top"
    [class.is-visible]="showBackToTop()"
    href="#top"
    aria-label="Back to top"
    title="Back to top"
    (click)="scrollToTop($event)"
>
    <span translate="no">TO TOP</span>
    <i class="progress-track" aria-hidden="true"><b [style.transform]="'scaleY(' + scrollProgress() / 100 + ')'"></b></i>
</a>
